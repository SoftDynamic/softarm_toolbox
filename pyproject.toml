[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "softarm-toolbox"
version = "0.2.0"
description = "SymPy-first continuum robot modelling and MATLAB/Simulink code generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["sympy==1.14.0"]

[project.optional-dependencies]
wolfram = ["wolframclient==1.4.0"]

[dependency-groups]
dev = ["numpy==2.5.1", "pytest==9.1.1", "ruff==0.16.1"]

[project.scripts]
softarm = "softarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"softarm.backends" = ["*.wls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
