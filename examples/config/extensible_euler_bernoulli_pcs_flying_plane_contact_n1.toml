[model]
rod = "extensible_euler_bernoulli"
parameterization = "pcs"
segments = 1
inertia = "lumped"

[base]
mode = "floating_rpy"
mount_xyz = [0.0, 0.0, 0.0]
mount_rpy = [0.0, 0.0, 0.0]

[integration]
method = "analytic"

[parameters]
gravity = 9.81
vehicle_mass = 1.5
vehicle_Ixx = 0.030
vehicle_Iyy = 0.030
vehicle_Izz = 0.050
rest_length = 0.45
mass = 0.18
Ixx = 0.0018
Iyy = 0.0018
Izz = 0.00010
k_bx = 1.1
k_by = 1.1
k_l = 45.0
d_bx = 0.05
d_by = 0.05
d_l = 0.10
tip_mass = 0.10
tip_Ixx = 0.01
tip_Iyy = 0.01
tip_Izz = 0.01

[actuation]
family = "tendon"
acceleration = "none"

[[actuation.channels]]
name = "t1"
kind = "unilateral"
[[actuation.channels.spans]]
section = 1
radius = 0.0275
angle = 0.0

[[actuation.channels]]
name = "t2"
kind = "unilateral"
[[actuation.channels.spans]]
section = 1
radius = 0.0275
angle = 2.0943951023931953

[[actuation.channels]]
name = "t3"
kind = "unilateral"
[[actuation.channels.spans]]
section = 1
radius = 0.0275
angle = 4.1887902047863905

[constraint]
family = "plane_point_contact"
tool_offset = [0.0, 0.0, 0.0]
plane_point = [0.0, 0.0, 0.45]
plane_normal = [0.0, 0.0, -1.0]
friction = 0.30
friction_velocity = 0.01
stabilization_frequency = 20.0
stabilization_ratio = 1.0

[dynamics]
formulation = "symbolic_lagrange"
